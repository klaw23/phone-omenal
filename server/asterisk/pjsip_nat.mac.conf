; macOS/Windows Docker only — mounted over pjsip_nat.conf by
; docker-compose.mac.yml. `(+)` appends to the [transport-udp] section
; defined in pjsip.conf.
;
; CHANGE external_* to your Mac's LAN IP if you move networks
; (`ipconfig getifaddr en0`). Without this, Asterisk advertises its
; container IP (172.17.x.x) in SDP and every call is silent.

[transport-udp](+)
external_media_address = 192.168.4.41
external_signaling_address = 192.168.4.41
