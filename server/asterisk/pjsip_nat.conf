; NAT settings for the SIP transport. Empty by default.
;
; On Linux/Pi with `network_mode: host` there is no NAT: Asterisk sees the
; real LAN interface and advertises the right address in SDP by itself.
;
; On macOS/Windows Docker the container sits behind a bridge (172.17.x.x), so
; Asterisk would advertise an unroutable address and calls connect with no
; audio. docker-compose.mac.yml mounts pjsip_nat.mac.conf over this file to
; correct that.
