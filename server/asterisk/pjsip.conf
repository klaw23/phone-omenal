; Phone-omenal switchboard — minimal PJSIP config
; Transport + endpoint templates live here. Actual device endpoints live in
; pjsip_devices.conf (generated by the switchboard app; ships with starter
; extensions 101-103 so Milestone 0 works before you run the app).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-t](!)
type=endpoint
context=phones
disallow=all
allow=ulaw
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes

[auth-t](!)
type=auth
auth_type=userpass

[aor-t](!)
type=aor
max_contacts=2
remove_existing=yes

#include pjsip_devices.conf
