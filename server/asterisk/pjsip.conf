; Open Phone Co. switchboard — minimal PJSIP config
; Extensions 101-103, password scheme "changeme-<ext>" — CHANGE THESE.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-t](!)
type=endpoint
context=phones
disallow=all
allow=ulaw
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes

[auth-t](!)
type=auth
auth_type=userpass

[aor-t](!)
type=aor
max_contacts=2
remove_existing=yes

[101](endpoint-t)
auth=101
aors=101
callerid="Phone 101" <101>
[101](auth-t)
username=101
password=changeme-101
[101](aor-t)

[102](endpoint-t)
auth=102
aors=102
callerid="Phone 102" <102>
[102](auth-t)
username=102
password=changeme-102
[102](aor-t)

[103](endpoint-t)
auth=103
aors=103
callerid="Phone 103" <103>
[103](auth-t)
username=103
password=changeme-103
[103](aor-t)
