; RTP port range. Narrow on purpose: on macOS/Windows Docker every published
; UDP port spawns a userland proxy, so a wide range makes `up` crawl.
; 10000-10030 = ~15 concurrent calls. Widen on Linux/Pi (host networking
; publishes nothing, so the cost there is zero).
[general]
rtpstart = 10000
rtpend = 10030
