; Open Phone Co. switchboard dialplan

[phones]
; phone-to-phone: dial any 1XX extension
exten => _1XX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Busy(10)

; 600: echo test — answers and plays your voice back (the classic first test)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()

; 601: says hello, proves one-way audio and codecs
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
