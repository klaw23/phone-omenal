; Phone-omenal switchboard dialplan

[phones]
; Numbering plan (docs/provisioning-and-switchboard-spec.md §2):
; numbers are 3-6 digits, first digit 1-9. 0... is reserved as the future
; inter-switchboard prefix; 6XX is the service range (600/601 below win over
; the patterns because exact matches beat patterns).
exten => _[1-9]XX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Busy(10)
exten => _[1-9]XXX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Busy(10)
exten => _[1-9]XXXX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Busy(10)
exten => _[1-9]XXXXX,1,Dial(PJSIP/${EXTEN},25)
 same => n,Busy(10)

; reserved: dialing 0 + anything will one day route to other switchboards.
; Until then, fast-busy so nothing can squat on the prefix.
exten => _0.,1,Congestion(5)
exten => 0,1,Congestion(5)

; 600: echo test — answers and plays your voice back (the classic first test)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Echo()

; 601: says hello, proves one-way audio and codecs
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
