# NOTE: host networking keeps SIP/RTP simple on Linux. On macOS/Windows Docker,
# host mode doesn't exist; expose 5060/udp and 10000-10100/udp instead and set
# rtp.conf to that range.
services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: openphone-switchboard
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./asterisk/cdr.conf:/etc/asterisk/cdr.conf:ro
      # generated by the switchboard app (written in place — single-file bind
      # mounts track the inode, so no atomic-rename writers)
      - ./asterisk/pjsip_devices.conf:/etc/asterisk/pjsip_devices.conf:ro
      - asterisk-logs:/var/log/asterisk

  # accounts, devices, numbers, call logs — http://<server>:8080
  switchboard:
    build: ./switchboard
    container_name: openphone-switchboard-app
    network_mode: host          # AMI on 127.0.0.1:5038, web on :8080
    restart: unless-stopped
    environment:
      AMI_PASS: changeme-ami    # must match asterisk/manager.conf
      # ADMIN_USERNAME / ADMIN_PASSWORD / ADMIN_EMAIL seed the first admin —
      # set these on first run; SWITCHBOARD_SECRET keeps logins/API tokens
      # valid across restarts
      ADMIN_EMAIL: admin@example.com
    volumes:
      - ./asterisk:/asterisk-conf
      - asterisk-logs:/var/log/asterisk:ro
      - switchboard-data:/data

volumes:
  asterisk-logs:
  switchboard-data:
